name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * *'

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  check-submodule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Tag from Upstream and Create Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 告诉 Git 忽略本地锁定的 Commit，拉取最新的子模块代码
          git submodule update --remote --merge
          
          # 2. 核心修改：通过 GitHub API 直接获取 openchamber 仓库最新的 Tag
          UPSTREAM_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/openchamber/openchamber/releases/latest \
            | jq -r '.tag_name')
          
          # 兜底：如果 releases 里没获取到，尝试直接拿最新的 git tag
          if [ "$UPSTREAM_TAG" = "null" ] || [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/openchamber/openchamber/tags \
              | jq -r '.[0].name')
          fi
          
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "❌ 无法获取 openchamber 的最新 Tag，终止流程。"
            exit 1
          fi
          
          echo "发现上游最新 Tag: $UPSTREAM_TAG"
          
          # 3. 检查当前仓库是否已经存在这个 Tag，避免重复构建
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$UPSTREAM_TAG)
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ 本仓库已存在 Tag $UPSTREAM_TAG，无需重复发布。"
            exit 0
          fi
          
          echo "🚀 本仓库缺少该 Tag，正在创建 $UPSTREAM_TAG 以触发构建流程..."
          
          # 4. 纠正了原本脚本中写错的 API URL（原脚本中把 -H 写成了 URL 前缀）
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d "{\"ref\": \"refs/tags/$UPSTREAM_TAG\", \"sha\": \"$(git rev-parse HEAD)\"}"

  create-release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Get version
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 兼容带有 v 和不带 v 的 Tag 提取
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NUM="${TAG_NAME#v}"
            echo "version=${VERSION_NUM}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          
          fs.mkdirSync('artifacts', { recursive: true });

          if (version.includes('-auto-') || version === '0.0.0-dev') {
            fs.writeFileSync('artifacts/release-notes.md', 'Automated build triggered by submodule update.\n');
            process.exit(0);
          }

          const changelogPath = path.join('openchamber', 'CHANGELOG.md');

          if (!fs.existsSync(changelogPath)) {
            fs.writeFileSync('artifacts/release-notes.md', `Release v${version} (No CHANGELOG.md found in submodule).\n`);
            process.exit(0);
          }
          
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const sections = changelog.split(/^## /m);
          // 兼容 [0.1.0] 或者 0.1.0 的标题写法
          const section = sections.find(s => s.startsWith('[' + version + ']') || s.startsWith(version));
          
          if (!section) {
            console.log(`⚠️ Warning: Changelog section for [${version}] not found. Using fallback release notes.`);
            fs.writeFileSync('artifacts/release-notes.md', `Automated release for version v${version}.\n\nSee full changes in the submodule repository.\n`);
          } else {
            const content = ('## ' + section).trim();
            fs.writeFileSync('artifacts/release-notes.md', content + '\n');
          }
          NODE

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: OpenChamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-windows:
    if: github.event_name != 'schedule'
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile --cwd openchamber

      - name: Build web assets
        working-directory: openchamber/packages/electron
        run: bun run build:web-assets

      - name: Bundle main process
        working-directory: openchamber/packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: openchamber/packages/electron
        shell: bash
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: openchamber/packages/electron
        shell: bash
        run: node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            openchamber/packages/electron/dist/*.exe
            openchamber/packages/electron/dist/*.blockmap
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@v7
        with:
          name: latest-yml-${{ matrix.target }}
          path: openchamber/packages/electron/dist/latest.yml
          retention-days: 1

  combine-electron-manifests:
    if: github.event_name != 'schedule'
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download per-arch latest-mac.yml
        uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*-apple-darwin
          path: artifacts

      - name: Finalize combined latest-mac.yml
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node openchamber/packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined manifests to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ runner.temp }}/latest-mac.yml
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    if: github.event_name != 'schedule'
    needs: [create-release, combine-electron-manifests]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_UPDATE_ROLE_ID }}
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send release to Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_ROLE_ID: ${{ env.DISCORD_UPDATE_ROLE_ID }}
        run: |
          node - <<'NODE'
          (async () => {
            const payload = {
              content: process.env.UPDATE_ROLE_ID ? `<@&${process.env.UPDATE_ROLE_ID}>` : undefined,
              embeds: [
                {
                  title: `OpenChamber v${process.env.VERSION} Has Been Released!`,
                  url: `https://github.com/${process.env.REPOSITORY}/releases/tag/v${process.env.VERSION}`,
                  color: 0xff4151,
                },
              ],
            };

            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord release: ${discordRes.status} ${body}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Trigger openchamber-website site refresh (optional)
        env:
          WEBSITE_REPO: openchamber/openchamber-website
          WEBSITE_TOKEN: ${{ secrets.OPENCHAMBER_WEBSITE_REPO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "OPENCHAMBER_WEBSITE_REPO_TOKEN not set; skip site refresh dispatch."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$WEBSITE_REPO/dispatches \
            -d @- <<JSON
          {
            "event_type": "site_refresh_requested",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "release_tag": "v$VERSION"
            }
          }
          JSON
