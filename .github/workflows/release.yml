name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * *'

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  check-submodule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and Update Submodule
        run: |
          # 仅在 Actions 虚拟环境中将子模块更新到远程最新版本以供检查
          git submodule update --remote --merge
          
          # 检查本地指针是否移动（代表上游是否有更新）
          if [ -n "$(git status --porcelain)" ]; then
            echo "检测到上游子模块有更新，正在通过 API 为当前应用仓库创建构建 Tag..."
            
            # 生成自动化构建专属的 Tag 名
            AUTO_TAG="v0.0.0-auto-$(date +'%Y%m%d%H%M')"
            
            # 使用 GitHub 官方 API 允许直接给当前最新提交打上 Tag
            # 这种方式不会向主分支推送任何普通 commit 文件，且能直接激活后续的 push.tags 流程
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/git/refs \
              -d "{\"ref\": \"refs/tags/$AUTO_TAG\", \"sha\": \"$(git rev-parse HEAD)\"}"
          else
            echo "No updates found for openchamber submodule."
          fi

  create-release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Get version
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          
          if (version.includes('-auto-') || version === '0.0.0-dev') {
            fs.mkdirSync('artifacts', { recursive: true });
            fs.writeFileSync('artifacts/release-notes.md', 'Automated build triggered by submodule update.\n');
            process.exit(0);
          }

          // 修改：精确定位到子模块内部的 CHANGELOG.md
          const changelogPath = path.join('openchamber', 'CHANGELOG.md');

          if (!fs.existsSync(changelogPath)) {
            throw new Error(`CHANGELOG.md not found at ${changelogPath}; please ensure it exists in the submodule.`);
          }
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const sections = changelog.split(/^## /m);
          const section = sections.find(s => s.startsWith('[' + version + ']'));
          if (!section) {
            throw new Error('Changelog section [' + version + '] not found. Add a section like "## [' + version + '] - YYYY-MM-DD".');
          }
          const content = ('## ' + section).trim();
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/release-notes.md', content + '\n');
          NODE

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: OpenChamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-windows:
    if: github.event_name != 'schedule'
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # 修改：使用 --cwd 指定在本地 ./openchamber 文件夹内拉取依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile --cwd openchamber

      - name: Build web assets
        working-directory: openchamber/packages/electron
        run: bun run build:web-assets

      - name: Bundle main process
        working-directory: openchamber/packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: openchamber/packages/electron
        shell: bash
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: openchamber/packages/electron
        shell: bash
        run: node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            openchamber/packages/electron/dist/*.exe
            openchamber/packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@v7
        with:
          name: latest-yml-${{ matrix.target }}
          path: openchamber/packages/electron/dist/latest.yml
          retention-days: 1

  combine-electron-manifests:
    if: github.event_name != 'schedule'
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download per-arch latest-mac.yml
        uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*-apple-darwin
          path: artifacts

      # 修改：运行脚本的目标地址也准确指向本地的子模块目录
      - name: Finalize combined latest-mac.yml
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node openchamber/packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined manifests to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ runner.temp }}/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    if: github.event_name != 'schedule'
    needs: [create-release, combine-electron-manifests]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_UPDATE_ROLE_ID }}
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send release to Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_ROLE_ID: ${{ env.DISCORD_UPDATE_ROLE_ID }}
        run: |
          node - <<'NODE'
          (async () => {
            const payload = {
              content: process.env.UPDATE_ROLE_ID ? `<@&${process.env.UPDATE_ROLE_ID}>` : undefined,
              embeds: [
                {
                  title: `OpenChamber v${process.env.VERSION} Has Been Released!`,
                  url: `https://github.com/${process.env.REPOSITORY}/releases/tag/v${process.env.VERSION}`,
                  color: 0xff4151,
                },
              ],
            };

            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord release: ${discordRes.status} ${body}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Trigger openchamber-website site refresh (optional)
        env:
          WEBSITE_REPO: openchamber/openchamber-website
          WEBSITE_TOKEN: ${{ secrets.OPENCHAMBER_WEBSITE_REPO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "OPENCHAMBER_WEBSITE_REPO_TOKEN not set; skip site refresh dispatch."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$WEBSITE_REPO/dispatches \
            -d @- <<JSON
          {
            "event_type": "site_refresh_requested",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "release_tag": "v$VERSION"
            }
          }
          JSON
